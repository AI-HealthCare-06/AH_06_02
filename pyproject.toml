[project]
name = "ai-health-example"
version = "0.1.0"
description = "AI 헬스케어 파이널 프로젝트 예시용"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dateutil>=2.9.0.post0",
    "redis>=7.1.0",
    "tomlkit>=0.14.0",
]

[dependency-groups]
ai = [
    "scikit-learn>=1.8.0",
    "torch",
    "torchvision",
    "torchaudio",
    "sentence-transformers>=5.2.0"
]
app = [
    "aerich>=0.9.2",
    "asyncmy>=0.2.11",
    "bcrypt<=4.0.1",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "orjson>=3.11.5",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=12.0.0",
    "pyjwt>=2.10.1",
    "tortoise-orm>=0.25.3",
    "uvicorn>=0.40.0",
]
dev = [
    "coverage>=7.13.2",
    "mypy>=1.19.1",
    "pre-commit>=4.4.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "types-passlib>=1.7.7.20250602",
    "types-python-dateutil>=2.9.0.20260124",
]
# scripts/model/ 의 실험 스크립트 전용. 앱 런타임은 쓰지 않으므로 기본 동기화에서 빠진다.
# 이 범위는 data/experiment-2024-final-full/*/report.json 의 packages 블록에 맞춘 것이다.
#
# shap 은 여기 없다. 실험이 쓴 0.50 대는 3.14 용 llvmlite 선공개판을 요구하는데 그게 배포돼
# 있지 않아서, requires-python 이 3.13 이상인 이 프로젝트의 lock 이 풀리지 않는다.
# marker 를 붙여도 uv 는 3.14 쪽 조합까지 풀어야 해서 같은 곳에서 막힌다.
# 그래서 shap 만 실행할 때 붙인다. 아래 한 줄이 실험용 전체 명령이다.
#   uv run --group model --with 'shap==0.50.0' python scripts/model/run_baseline.py ...
# shap 버전이 바뀌면 기여도 수치가 달라져 기존 산출물과 비교가 안 되므로 == 로 박아 둔다.
model = [
    "joblib>=1.5.3",
    "numpy>=2.5.3,<3",
    "pandas>=2.3.3,<3",
    "pyreadstat>=1.3.5,<2",
    "scikit-learn>=1.8.0,<2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.aerich]
tortoise_orm = "app.core.db.databases.TORTOISE_ORM"
location = "./app/core/db/migrations"
src_folder = "./."

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# CI 와 같은 범위. tests/model_contract 는 CI 에서 pandas 를 붙여 unittest 로 따로 돈다
testpaths = ["app"]

# ================================================================
# Ruff (Linter & Formatter) Settings
# ================================================================
[tool.ruff]
# 검사에서 제외할 파일 및 디렉터리 목록
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "**/migrations/**",
]
# 한 줄의 최대 글자 수. 멘토님 공통 설정은 100이지만 기존 코드 126개 파일이 120 기준으로
# 포맷돼 있어 재포맷 diff를 피하려고 120으로 둔다
line-length = 120
target-version = "py313"

# --- Linter (코드 분석기) 설정 ---
[tool.ruff.lint]
# E, W: pycodestyle (에러, 경고) · F: Pyflakes (논리적 오류) · I: isort (import 정렬)
# 아래 넷은 멘토님 공통 설정에 없지만 쓰던 것을 유지한다
# C90: 복잡도 · B: bugbear · UP: pyupgrade · N: pep8-naming
select = ["E", "F", "W", "I", "C90", "B", "UP", "N"]
ignore = ["UP046"]

# 모든 수정 가능한 규칙을 자동으로 고치도록 설정
fixable = ["ALL"]
unfixable = []

# --- Formatter (코드 포맷터) 설정 ---
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --- 파일/디렉터리별 규칙 무시 설정 ---
[tool.ruff.lint.per-file-ignores]
# __init__.py: 하위 모듈 노출을 위한 미사용·와일드카드 import 허용
"**/__init__.py" = ["F401", "F403"]
# 테스트 파일: 가독성을 위해 긴 줄 허용
"**/test_*.py" = ["E501"]

[tool.mypy]
# scripts/model 은 __init__.py 없이 scripts.model.* 로 import 되므로 경로 기준으로 모듈 이름을 정한다
explicit_package_bases = true
# scripts/model 은 app 의존성에 없는 numpy·pandas 로 돌아간다.
# CI 도 uv run --with 로 따로 실행하므로 app 타입 검사 대상에서 뺀다.
exclude = "^scripts/model/"

[[tool.mypy.overrides]]
# tests/model_contract 가 import 하는 바람에 exclude 를 타고 들어오는 학습 스크립트
module = ["scripts.model.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
# 타입 정보를 내보내지 않는 문서 스크립트용 서드파티
module = ["openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ai_worker 추론 의존성. app 그룹에 없고(pandas·joblib 은 model 그룹) shap 은 워커 이미지에만 설치한다
module = ["joblib.*", "pandas.*", "shap.*"]
ignore_missing_imports = true
