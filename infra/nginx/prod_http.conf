upstream fastapi {
    server fastapi:8000;
}

server {
    server_name 도메인 혹은 EC2_IP;

    listen 80;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    location /api/ {
        client_max_body_size 11m;  # 10 MiB 사진과 multipart 경계 여유
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    location /frontend/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # 주소만 치고 들어오면 서비스 첫 화면으로 보낸다. 그 밖의 경로는 그대로 404
    location = / {
        return 302 /frontend/;
    }

    location / {
        return 404;
    }
}
