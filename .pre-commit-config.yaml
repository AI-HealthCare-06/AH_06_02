ci:
  autoupdate_schedule: monthly

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # 시안 HTML 은 글꼴·이미지가 base64 로 박혀 있어 기본 한도(500KB)를 넘는다
        exclude: '^frontend/docs/prototype/'
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # 마크다운 줄 끝 공백 두 칸은 줄바꿈이라 남긴다
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      # 루트에 허용 목록 밖의 파일·폴더가 생기면 커밋을 막는다 (scripts/ci/check_root_files.py)
      - id: check-root-files
        name: 루트 파일 허용 목록 검사
        entry: python scripts/ci/check_root_files.py
        language: python
        pass_filenames: false
        always_run: true
      # 마크다운 본문의 물결표는 \~ 로 쓴다. GitHub 이 두 물결표 사이를 취소선으로 그린다
      - id: check-markdown-tildes
        name: 마크다운 물결표 검사
        entry: python scripts/ci/check_markdown_tildes.py
        language: python
        files: '\.md$'
